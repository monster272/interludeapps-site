<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interludeapps</title>
<style>
  :root { --ink:#2A2622; --soft:#5C544C; --bg:#FDF6EC; --card:#FFFCF7; --line:#E8DCCB; --accent:#B45309; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#F2E9DC; --soft:#B8AC9C; --bg:#1A1614; --card:#241E1A; --line:#3A322C; --accent:#E8A857; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); padding:2rem 1.25rem;
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:32rem; width:100%; }
  h1 { font-size:1.75rem; margin:0 0 .3rem; }
  .sub { color:var(--soft); margin:0 0 2rem; }
  h2 { font-size:1.05rem; margin:0 0 .3rem; }
  .card { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:1.1rem 1.25rem; margin-bottom:.75rem; text-decoration:none; color:inherit; }
  .card p { margin:0; color:var(--soft); font-size:.94rem; }
  .card:hover { border-color:var(--accent); }
  a { color:var(--accent); }
  footer { margin-top:2rem; color:var(--soft); font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sadhana Lock</h1>
  <p class="sub">Your distracting apps rest. A little practice opens them again.</p>

  <a class="card" href="/privacy.html">
    <h2>Privacy Policy</h2>
    <p>What the app stores, and why it cannot read your screen.</p>
  </a>
  <a class="card" href="/terms.html">
    <h2>Terms of Service</h2>
    <p>What the app promises, and what it does not.</p>
  </a>

  <footer>
    Interludeapps · <a href="mailto:interludeapp.official@gmail.com">interludeapp.official@gmail.com</a>
  </footer>
</div>
</body>
</html>
