<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interlude Apps</title>
<meta name="description" content="Interlude Apps makes PalmVani: free AI palm reading, daily rashifal and couple palm match in Hindi and English.">
<meta name="theme-color" content="#F7F4EE">
<style>
  :root { --bg: #F7F4EE; --card: #FFFFFF; --ink: #1F1B16; --soft: #645B52; --line: #E4DDD2; --link: #B23A1F; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16130F; --card: #221D18; --ink: #F3EEE6; --soft: #BFB4A6; --line: #3A322A; --link: #FF8A6E; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 6px; }
  .lead { color: var(--soft); margin: 0 0 32px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin: 0 0 16px; }
  .app h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .app p { margin: 0 0 10px; color: var(--soft); }
  .links { display: flex; flex-wrap: wrap; gap: 16px; }
  a { color: var(--link); }
  footer { margin-top: 40px; color: var(--soft); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>Interlude Apps</h1>
  <p class="lead">Small, honest Android apps. No trials, no surprise charges.</p>

  <section class="app">
    <h2>PalmVani</h2>
    <p>Free AI palm reading, daily rashifal and couple palm match, in Hindi and English.</p>
    <div class="links">
      <a href="/palmvani/privacy.html">Privacy policy</a>
      <a href="/palmvani/privacy.html#hi">गोपनीयता नीति</a>
    </div>
  </section>

  <footer>Contact: <a href="mailto:interludeapp.official@gmail.com">interludeapp.official@gmail.com</a></footer>
</main>
</body>
</html>
